name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_package:
        description: Keep the validated Windows ZIP as a workflow artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CPA_DATA_DIR: ${{ runner.temp }}\cpa-validation
      CPA_NO_PAUSE: '1'
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-windows-py312.txt
      - name: Install validated dependency versions
        run: python -m pip install -r requirements-dev.txt -c constraints-windows-py312.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q main.py src
      - name: Run unit and Qt workflow tests
        run: python -m unittest discover -s tests
      - name: Build and validate packaging/ConstructionAccounting.spec
        run: .\build.bat win64
      - name: Upload package on manual request
        if: github.event_name == 'workflow_dispatch' && inputs.upload_package
        uses: actions/upload-artifact@v4
        with:
          name: ConstructionAccounting-win64
          path: dist/ConstructionAccounting-*-win64.zip
          if-no-files-found: error
          retention-days: 7
